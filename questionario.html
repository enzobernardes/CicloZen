<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CicloZen</title>
  <link rel="stylesheet" href="questionario-style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>
  <header>
    <div class="logo">
      <a href="index.html"> <img src="img/logo.png" alt="logo"></a>
      <p>CicloZen</p>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="sono.html">Sono</a></li>
        <li><a href="preSono.html">Pré-sono</a></li>
        <li><a href="habitos.html">Hábitos</a></li>
        <li><a href="questionario.html" class="active">Questionário</a></li>
        <li><a href="sobreNos.html">Sobre nós</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section class="quest">
      <h1>Questionário</h1>

      <form>
        <label for="estudo">Quantas horas por dia você passa estudando?</label>
        <select id="estudo">
          <option value="0">Nenhuma</option>
          <option value="1">Menos de 1</option>
          <option value="2">1–3 horas</option>
          <option value="3">3–6 horas</option>
          <option value="4">6+ horas</option>
        </select>

        <label for="exercicio">Quantas horas por dia você se exercita?</label>
        <select id="exercicio">
          <option value="0">Nenhuma</option>
          <option value="1">Menos de 1</option>
          <option value="2">1–3 horas</option>
          <option value="3">3–6 horas</option>
          <option value="4">6+ horas</option>
        </select>

        <label for="celular">Quanto tempo usa o celular antes de dormir?</label>
        <select id="celular">
          <option value="0">Nenhum</option>
          <option value="1">Menos de 1h</option>
          <option value="2">1–3h</option>
          <option value="3">3h+</option>
        </select>

        <label for="cansado">Com que frequência acorda cansado(a)?</label>
        <select id="cansado">
          <option value="0">Baixa</option>
          <option value="1">Média</option>
          <option value="2">Alta</option>
        </select>

        <label for="dormir">A que horas você se deita?</label>
        <input type="time" id="dormir">

        <label for="acordar">A que horas você acorda?</label>
        <input type="time" id="acordar">

        <label for="adormecer">Minutos para adormecer:</label>
        <input type="number" id="adormecer" min="0" placeholder="Ex: 20">

        <label for="fins">Sua rotina muda no fim de semana?</label>
        <select id="fins">
          <option value="sim">Sim</option>
          <option value="nao">Não</option>
        </select>

        <label for="relax">Você faz algo para relaxar antes de dormir?</label>
        <select id="relax">
          <option value="sim">Sim</option>
          <option value="nao">Não</option>
        </select>

        <button type="button" onclick="calcularResultado()">Enviar</button>
      </form>
    </section>

    <section class="pg1">
      <div></div>
      <button onclick="voltar()">Voltar</button>
    </section>
  </main>

  <footer>
    <div class="left-footer">
      <h2>Redes Sociais:</h2>
      <ul>
        <li>
          <a href="https://www.instagram.com/ciclo.zen_/?next=%2F">
            <i class="fa-brands fa-2x fa-instagram" style="color: #ffffff;"></i>
          </a>
        </li>
        <li>
          <a href="https://x.com/ciclo_zen_">
            <i class="fa-brands fa-2x fa-x-twitter" style="color: #ffffff;"></i>
          </a>
        </li>
        <li>
          <a href="https://github.com/enzobernardes/CicloZen">
            <i class="fa-brands fa-2x fa-github" style="color: #ffffff;"></i>
          </a>
        </li>
      </ul>
    </div>

    <div class="right-footer">
      <img src="img/logo.png" alt="logo">
      <p>CicloZen © Todos os direitos reservados.</p>
    </div>
  </footer>

  <script>
    const parte_I = document.querySelector(".quest");
    const parte_II = document.querySelector(".pg1");
    parte_II.style.display = "none";

    function calcularResultado() {
      let respostas = {
        estudo: Number(estudo.value),
        exercicio: Number(exercicio.value),
        celular: Number(celular.value),
        cansado: Number(cansado.value),
        dormir: dormir.value,
        acordar: acordar.value,
        adormecer: Number(adormecer.value),
        fins: fins.value,
        relax: relax.value
      };

      const dormirDate = new Date(`2000-01-01T${respostas.dormir}`);
      const acordarDate = new Date(`2000-01-02T${respostas.acordar}`);
      let diffHrs = (acordarDate - dormirDate) / (1000 * 60 * 60);

      if (diffHrs < 0) diffHrs += 24;

      respostas.horasSono = diffHrs;

      let dicas = [];

      if (respostas.celular >= 3)
        dicas.push("Reduza o uso de telas 1–2 horas antes de dormir para melhorar a produção de melatonina.");

      if (respostas.dormir >= "23:00")
        dicas.push("Tente ir para a cama entre 21h e 22h30 para regular seu ritmo circadiano.");

      if (respostas.horasSono < 6)
        dicas.push("Você está dormindo pouco. Busque manter pelo menos 7 a 8 horas de sono por noite.");
      else if (respostas.horasSono < 7)
        dicas.push("Seu sono está quase ideal, tente aumentar um pouco o tempo total.");

      if (respostas.adormecer > 30)
        dicas.push("Pratique respiração profunda ou leitura leve para adormecer mais rápido.");
      if (respostas.adormecer > 60)
        dicas.push("Seu tempo para adormecer está alto. Evite telas e luz forte antes de dormir.");

      if (respostas.fins === "sim")
        dicas.push("Evite variar demais os horários de dormir/acordar nos fins de semana.");

      if (respostas.relax === "nao")
        dicas.push("Inclua um ritual de relaxamento: banho quente, música calma ou alongamentos.");

      if (respostas.exercicio === 0)
        dicas.push("Praticar 20–30 minutos de exercícios leves melhora muito a qualidade do sono.");

      if (respostas.cansado === 2)
        dicas.push("Tente ajustar horários fixos e melhorar a higiene do sono para reduzir o cansaço.");

      if (respostas.estudo >= 3)
        dicas.push("Evite estudar até muito tarde. Tente encerrar atividades mentais pesadas até 21h.");

      const resultadoHTML = `
        <h2>Relatório Personalizado de Sono</h2>
        <p><strong>Horas de sono:</strong> ${respostas.horasSono.toFixed(1)}h</p>
        
        <h3>Recomendações para melhorar seu sono:</h3>
        <ul>
            ${dicas.map(d => `<li>${d}</li>`).join("")}
        </ul>
      `;

      document.querySelector(".pg1 div").innerHTML = resultadoHTML;

      parte_I.style.display = "none";
      parte_II.style.display = "block";
    }

    function voltar() {
      parte_I.style.display = "block";
      parte_II.style.display = "none";
    }
  </script>

</body>

</html>
