<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CicloZen</title>
  <link rel="stylesheet" href="questionario-style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>
  <header>
    <div class="logo">
      <a href="index.html"> <img src="img/logo.png" alt="logo"></a>
      <p>CicloZen</p>
    </div>

    <nav id="menu">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="sono.html">Sono</a></li>
        <li><a href="preSono.html">Pré-sono</a></li>
        <li><a href="habitos.html">Hábitos</a></li>
        <li><a href="questionario.html" class="active">Questionário</a></li>
        <li><a href="sobrenos.html">Sobre nós</a></li>
      </ul>
    </nav>

    <button id="temaEscuro">🌙</button>
  </header>
  <main>
    <section class="quest">
      <h1>Questionário</h1>

      <form>
        <label for="estudo">Quantas horas por dia você passa estudando?</label>
        <select id="estudo" name="estudo">
          <option value="0">Nenhuma</option>
          <option value="1">Menos de 1</option>
          <option value="2">1–3 horas</option>
          <option value="3">3–6 horas</option>
          <option value="4">6+ horas</option>
        </select>

        <label for="exercicio">Quantas horas por dia você se exercita?</label>
        <select id="exercicio" name="exercicio">
          <option value="0">Nenhuma</option>
          <option value="1">Menos de 1</option>
          <option value="2">1–3 horas</option>
          <option value="3">3–6 horas</option>
          <option value="4">6+ horas</option>
        </select>

        <label for="celular">Quanto tempo usa o celular antes de dormir?</label>
        <select id="celular" name="celular">
          <option value="0">Nenhum</option>
          <option value="1">Menos de 1h</option>
          <option value="2">1–3h</option>
          <option value="3">3h+</option>
        </select>

        <label for="cansado">Com que frequência acorda cansado(a)?</label>
        <select id="cansado" name="cansado">
          <option value="0">Baixa</option>
          <option value="1">Média</option>
          <option value="2">Alta</option>
        </select>

        <label for="dormir">A que horas você se deita?</label>
        <input type="time" id="dormir" name="dormir">

        <label for="acordar">A que horas você acorda?</label>
        <input type="time" id="acordar" name="acordar">

        <label for="sono">Horas de sono por noite:</label>
        <input type="number" id="sono" min="0" step="0.5" name="sono" placeholder="Ex: 6.5">

        <label for="adormecer">Minutos para adormecer:</label>
        <input type="number" id="adormecer" min="0" name="adormecer" placeholder="Ex: 20">

        <label for="fins">Sua rotina muda no fim de semana?</label>
        <select id="fins" name="fins">
          <option value="sim">Sim</option>
          <option value="nao">Não</option>
        </select>

        <label for="relax">Você faz algo para relaxar antes de dormir?</label>
        <select id="relax" name="relax">
          <option value="sim">Sim</option>
          <option value="nao">Não</option>
        </select>

        <button type="button" onclick="calcularResultado()">Enviar</button>
      </form>
    </section>
    <section class="pg1">
      <div></div>
      <button onclick="voltar()">Voltar</button>
    </section>

  </main>
  <footer>
    <div class="left-footer">
      <h2>Redes Sociais:</h2>
      <ul>
        <li><a href="https://www.instagram.com/ciclo.zen_/?next=%2F"><i class="fa-brands fa-2x fa-instagram"
              style="color: #ffffff;"></i></a></li>
        <li><a href="https://x.com/ciclo_zen_"><i class="fa-brands fa-2x fa-x-twitter" style="color: #ffffff;"></i></a>
        </li>
        <li><a href="https://github.com/enzobernardes/CicloZen"><i class="fa-brands fa-2x fa-github"
              style="color: #ffffff;"></i></a></li>
      </ul>
    </div>

    <div class="right-footer">
      <img src="img/logo.png" alt="logo">
      <p>CicloZen © Todos os direitos reservados.</p>
    </div>
  </footer>
  <script>

    const parte_I = document.querySelector(".quest");
    const parte_II = document.querySelector(".pg1");
    parte_II.style.display = "none";

    function calcularResultado() {

      let score = 0;

      score += Number(document.getElementById("estudo").value);
      score += Number(document.getElementById("exercicio").value);
      score += Number(document.getElementById("celular").value);
      score += Number(document.getElementById("cansado").value);

      let dormir = document.getElementById("dormir").value;
      let acordar = document.getElementById("acordar").value;

      if (dormir >= "23:00") score += 2;
      if (dormir >= "01:00") score += 3;
      if (acordar <= "06:00") score += 2;

      let horasSono = Number(document.getElementById("sono").value);
      if (horasSono < 6) score += 3;
      else if (horasSono < 7) score += 2;

      let adormecer = Number(document.getElementById("adormecer").value);
      if (adormecer > 30) score += 2;
      if (adormecer > 60) score += 3;

      let fins = document.getElementById("fins").value;
      if (fins === "sim") score += 1;

      let relax = document.getElementById("relax").value;
      if (relax === "nao") score += 2;

      let mensagem = "";

      if (score <= 6) {
        mensagem = `
          <h2 style="color:#67b26f">Seu Sono Está Ótimo!</h2>
          <p>Sua rotina está equilibrada e saudável. Continue assim!</p>
        `;
      }
      else if (score <= 12) {
        mensagem = `
          <h2 style="color:#e5b143">Sono Regular</h2>
          <p>Alguns hábitos podem melhorar. Tente dormir mais cedo e reduzir telas antes de dormir.</p>
        `;
      }
      else {
        mensagem = `
          <h2 style="color:#d9534f">Sono Prejudicado</h2>
          <p>Seu padrão de sono pode estar afetando sua saúde. Ajustar horários e rotinas vai te ajudar muito.</p>
        `;
      }

      document.querySelector(".pg1 div").innerHTML = mensagem;

      parte_I.style.display = "none";
      parte_II.style.display = "block";
    }

    function voltar() {
      parte_I.style.display = "block";
      parte_II.style.display = "none";
    }

    const btn = document.getElementById("temaEscuro");
    const body = document.body;

    btn.addEventListener("click", () => {
      body.classList.toggle("dark");
      btn.textContent = body.classList.contains("dark") ? "☀️" : "🌙";
    });
  </script>

</body>

</html>
